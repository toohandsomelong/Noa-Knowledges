[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kgrag"
version = "0.1.0"
description = "Zero-shot KG-RAG Walk&Retrieve on Vietnamese university regulations"
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
export = ["docling>=2.145.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
