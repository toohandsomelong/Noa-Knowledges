project:
  name: kgrag
  seed: 42
  data_dir: data
  artifact_dir: artifacts

cloudflare:
  account_id_env: CLOUDFLARE_ACCOUNT_ID
  api_token_env: CLOUDFLARE_API_TOKEN
  api_base: https://api.cloudflare.com/client/v4/accounts
  chat_model: "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
  embedding_model: "@cf/baai/bge-m3"
  embedding_dim: 1024
  temperature: 0.0
  max_tokens: 512
  timeout_s: 90
  max_retries: 5
  min_interval_s: 0.25
  json_mode: false

deepseek:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  generator_model: deepseek-flash
  judge_model: deepseek-v4-pro
  temperature: 0.0
  max_tokens: 4096
  timeout_s: 120
  max_retries: 5
  thinking: disabled

quota:
  daily_neuron_limit: 9000
  ledger_path: artifacts/quota_ledger.csv

ingest:
  source_path: sources/quyche/Toàn văn quy chế đào tạo theo tín chỉ.txt
  encoding: utf-8
  strip_patterns:
    - '\[CHECK:.*?\]'

kg:
  min_confidence: 0.6
  audit_ratio: 0.1
  max_articles: null
  article_ids: null

walks:
  strategies:
    - bfs
    - rw
  depth: 3
  walks_per_node: 10
  max_walks_per_node_bfs: 20
  seed: 42

retrieval:
  top_k_nodes: 3
  top_k_walks: 3
  max_context_tokens: 4096
  scope: nodes_walks

generation:
  max_answer_tokens: 512
  abstain_text: Tôi không biết câu trả lời

eval:
  questions_path: data/qa/questions_test.jsonl
  judge: deepseek
  judge_sample_rate: 1.0
  bootstrap_samples: 1000
  calibration_size: 30
